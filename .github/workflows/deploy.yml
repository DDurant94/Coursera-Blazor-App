name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment can run at a time; cancel any in-progress run for the same branch.
concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  # ── Build ────────────────────────────────────────────────────────────────────
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      # StaticWebAssetBasePath tells the Blazor publish pipeline to embed
      # the correct <base href> in index.html — more reliable than post-hoc sed.
      - name: Publish
        run: dotnet publish -c Release -o publish -p:StaticWebAssetBasePath=/${{ github.event.repository.name }}

      # GitHub Pages runs Jekyll by default; files starting with "_" (like
      # Blazor's _framework/ folder) get stripped unless we opt out.
      - name: Disable Jekyll
        run: touch publish/wwwroot/.nojekyll

      # GitHub Pages returns 404.html for any path it can't find.  Copying
      # index.html there means Blazor's client-side router still boots and
      # handles the real URL — so deep links and browser refreshes work.
      - name: Copy index.html → 404.html for SPA routing
        run: cp publish/wwwroot/index.html publish/wwwroot/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: publish/wwwroot

  # ── Deploy ───────────────────────────────────────────────────────────────────
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
